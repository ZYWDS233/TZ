<P><FONT face=等线 size=2><p style="MARGIN-BOTTOM: 24pt; MARGIN-TOP: 24pt; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span style="FONT-SIZE: 26pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; FONT-WEIGHT: bold; MIN-HEIGHT: 26pt"><FONT face=等线>敏捷</FONT></span></p><p style="MARGIN-BOTTOM: 6pt; MARGIN-TOP: 6pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; MIN-HEIGHT: 11pt"><FONT face=等线>敏捷代表机敏度、反射速度、平衡力。敏捷检定可以对应进行灵巧、迅速、安静的移动，或在不稳定的地方保持平衡。体操、巧手、隐蔽等技能分别反映了某几类敏捷检定可以表示的能力。</FONT></span></p><p class="it365-janqi-com_1" style="MARGIN-BOTTOM: 7pt; MARGIN-TOP: 19pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span id="heading_0"></span><span style="FONT-SIZE: 18pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; FONT-WEIGHT: bold; COLOR: rgb(216,57,49); MIN-HEIGHT: 18pt"  ><FONT face=等线>体操</FONT></span></p><p style="MARGIN-BOTTOM: 6pt; MARGIN-TOP: 6pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; MIN-HEIGHT: 11pt"><FONT face=等线>敏捷（体操）检定涵盖了在冰块上奔跑，在绳索上平衡，在摇曳甲板上站稳等需要保持平衡和高难度体操动作的情况。</FONT></span></p><p class="it365-janqi-com_1" style="MARGIN-BOTTOM: 7pt; MARGIN-TOP: 19pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span id="heading_1"></span><span style="FONT-SIZE: 18pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; FONT-WEIGHT: bold; COLOR: rgb(216,57,49); MIN-HEIGHT: 18pt"  ><FONT face=等线>巧手</FONT></span></p><p style="MARGIN-BOTTOM: 6pt; MARGIN-TOP: 6pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; MIN-HEIGHT: 11pt"><FONT face=等线>敏捷（巧手）的用法很多，比如制作细致的小东西、撬锁、解除陷阱或尝试撬锁或从其他人的口袋中摸鱼。</FONT></span></p><p class="it365-janqi-com_1" style="MARGIN-BOTTOM: 7pt; MARGIN-TOP: 19pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span id="heading_2"></span><span style="FONT-SIZE: 18pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; FONT-WEIGHT: bold; COLOR: rgb(216,57,49); MIN-HEIGHT: 18pt"  ><FONT face=等线>隐蔽</FONT></span></p><p style="MARGIN-BOTTOM: 6pt; MARGIN-TOP: 6pt; TEXT-ALIGN: left; LINE-HEIGHT: 1.2; margin-inline-start: 0pt"><span style="FONT-SIZE: 11pt; FONT-FAMILY: Arial, DengXian, Microsoft YaHei, sans-serif; MIN-HEIGHT: 11pt"><FONT face=等线>你尝试躲起避过敌人、躲过守卫、偷偷溜走、无声息地绕到某人背后或进行需要不被别人发现的行动时，进行一次敏捷（隐蔽）检定。</FONT></span></p></ARTICLE><footer></FOOTER></SECTION></FONT></P></body></HTML>
